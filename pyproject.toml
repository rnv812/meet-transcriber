[project]
name = "meet-transcriber"
version = "0.1.0"
requires-python = ">=3.12"
# Остальные зависимости (faster-whisper, pyannote, pyaudiowpatch...) исторически
# ставятся в venv вручную; здесь объявлены только нужные трею.
# pycaw — второй сигнал детектора звонка (WASAPI-сессии); без него трей
# работает, но видит только микрофон. comtypes и psutil приходят вместе с ним.
dependencies = ["pystray", "pillow", "pycaw"]

[project.scripts]
meet = "meet.cli:main"

[project.gui-scripts]
meet-tray = "meet.tray:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
