[project]
name = "meet-transcriber"
version = "0.4.0"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Andrey Aleynikov" },
    { name = "Nikita Reznikov" },
    { name = "Andrey Sivukha" },
]
# Лёгкое ядро: запись, трей, панель, ассистент. Тяжёлый стек расшифровки живёт в
# extras engine-cuda / engine-cpu (список зеркалит engine.PACKAGES, тест следит
# за расхождением); torch ставится отдельным шагом с нужного индекса
# (engine.uv_steps), поэтому в extras его нет. GigaAM — архивом коммита с
# GitHub (на PyPI его нет; git у пользователя может не стоять), см. engine.GIGAAM;
# для разработки: pip install -e .[engine-cuda,gigaam].
# pycaw — второй сигнал детектора звонка (WASAPI-сессии); psutil объявлен явно:
# на нём держатся проверка живости клиента конференций и отпечаток процесса в tray.lock.
# macOS (экспериментально): вместо pyaudiowpatch и pycaw — sounddevice (колесо
# несёт PortAudio), системный звук и сигналы детектора — помощник meet-audiotap;
# pystray там не нужен (меню — у оболочки).
# pypdf — текст PDF для материалов ассистента (meet.materials): чистый Python,
# импорт ленивый; без него PDF подключается только названием. Не ниже 6.19:
# в 6.x — пределы распаковки потоков и исправления зацикливаний на битых PDF.
dependencies = [
    "pystray; sys_platform == 'win32'", "pillow",
    "pycaw; sys_platform == 'win32'", "psutil",
    "pyaudiowpatch; sys_platform == 'win32'",
    "sounddevice>=0.4.6; sys_platform == 'darwin'",
    "numpy", "scipy", "aiohttp", "claude-agent-sdk", "keyring", "pypdf>=6.19",
]

[project.optional-dependencies]
engine-cpu = [
    "faster-whisper>=1.2,<2",
    "av>=11,<19",
    "pyannote.audio>=4.0,<5",
    "transformers>=4.40,<6",
    "scipy>=1.11",
]
# Apple Silicon (macOS, экспериментально): те же пакеты, что у CPU; torch — с
# PyPI отдельным шагом (engine.uv_steps, профиль mac).
engine-mac = [
    "faster-whisper>=1.2,<2",
    "av>=11,<19",
    "pyannote.audio>=4.0,<5",
    "transformers>=4.40,<6",
    "scipy>=1.11",
]
engine-cuda = [
    "faster-whisper>=1.2,<2",
    "av>=11,<19",
    "pyannote.audio>=4.0,<5",
    "transformers>=4.40,<6",
    "scipy>=1.11",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]
# GigaAM — отдельным extra и отдельным шагом установщика: его сбой (сеть,
# перепакованный архив) не валит установку движка (engine.OPTIONAL_PACKAGES).
gigaam = [
    "gigaam @ https://github.com/salute-developers/GigaAM/archive/7447938d791c4f3e643386ee22c33777004293a5.zip#sha256=17c9a57a8c76659feb112b4a6299391757d137fc50e5375d5613c46c379f3653",
]

[project.scripts]
meet = "meet.cli:main"

[project.gui-scripts]
meet-tray = "meet.tray:main"

[build-system]
# 77 — первая версия с SPDX-лицензией и license-files (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Данных вне .py в src/meet сейчас нет; шаблон страхует будущие ресурсы.
meet = ["*.json", "*.txt", "*.html", "*.ico", "*.png"]
