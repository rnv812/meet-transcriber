[package]
name = "meet-desktop"
version = "0.3.0"
description = "Оболочка Meet: трей, уведомления, окно приложения"
authors = ["Andrey Aleynikov", "Nikita Reznikov", "Andrey Sivukha (ndrsvh)"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Позиция и размер окна между запусками: окно открывается там, где его
# оставили, а не прыгает в центр экрана.
tauri-plugin-window-state = "2"
# Уведомления Windows («идёт запись», «расшифровка готова», сбои резидента).
tauri-plugin-notification = "~2.4"
# Диалоги выбора файла (импорт записи) и «Сохранить как».
tauri-plugin-dialog = "~2.7"
# Вопрос «Удалить текущую запись?» из трея: напрямую, тем же rfd, что внутри
# плагина диалогов (версия и возможности — как у него), — плагин выдаёт Esc за
# нажатие второй кнопки, а нужно отличать «Удалить» от закрытия окна.
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }
# Id нового сеанса Claude Code во вкладке «Агент» (`--session-id <uuid>`):
# по нему «Продолжить прошлую» возвращает именно этот разговор. Уже в дереве
# через tauri (та же версия и возможность v4).
uuid = { version = "1", features = ["v4"] }
# Один экземпляр: повторный запуск (ярлык, `--recording <id>`) не плодит
# второй трей и второй резидент, а открывает окно в уже запущенной оболочке.
# 2.5+ требует tauri 2.12 — закреплено на 2.4.x под tauri 2.11 (как в
# Cargo.lock), чтобы `cargo update` не утащил несовместимую версию. Так же
# закреплены notification и dialog: их минорные версии идут в ногу с tauri.
tauri-plugin-single-instance = "~2.4"
# «Запускать вместе с Windows» (шаг «Готово» мастера): значение в
# HKCU\Software\Microsoft\Windows\CurrentVersion\Run. 2.6+ требует tauri 2.12 —
# закреплено на 2.5.x под tauri 2.11, как плагины выше.
tauri-plugin-autostart = "~2.5"
# Синхронный HTTP-клиент к control API резидента: вызывается из рабочих
# потоков надзора и опроса, async-рантайм там не нужен. Для API резидента —
# http на 127.0.0.1; HTTPS нужен только кнопке «Проверить обновления»
# (GitHub, `updater.rs`): TLS через native-tls — на Windows это SChannel с
# корневыми сертификатами системы (корпоративный прокси с подменой
# сертификата работает так же, как в браузере). gzip не нужен.
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 колеса meet в маркере движка: пересборка той же версии видна по
# хэшу, а не по номеру версии (уже есть в дереве через tauri-codegen).
sha2 = "0.10"
# Вкладка «Агент»: псевдоконсоль (ConPTY на Windows) для интерактивного
# Claude Code / Codex во встроенном терминале окна (`pty.rs`).
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
# Жив ли держатель tray.lock (OpenProcess + GetExitCodeProcess): старый
# резидент без API оболочка не трогает, пока он жив. Свободное место перед
# установкой движка — GetDiskFreeSpaceExW; uv в job object, чтобы он умирал
# вместе с оболочкой. ShellExecuteW — страницы мастера в браузере (без cmd:
# его метасимволы в адресе не разбираются). RegGetValueW — есть ли значение
# автозапуска в HKCU Run (восстановление после обновления). ToolHelp и
# QueryFullProcessImageNameW — помощник установщика ждёт процессы из папки
# установки (`install_wait.rs`). GetModuleHandleW и LoadImageW — значок окон
# из ресурса exe нужного размера (`app_icon.rs`).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# macOS (экспериментально, `platform.rs`): жив ли процесс (kill 0), группа
# процессов вместо job object (killpg), свободное место (statvfs). Уже есть
# в дереве через tauri.
libc = "0.2"

[features]
# Дефолт Tauri: в релизе окно без консоли.
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
