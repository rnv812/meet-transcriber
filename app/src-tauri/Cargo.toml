[package]
name = "meet-desktop"
version = "0.1.0"
description = "Оболочка meet: трей, уведомления, окно приложения"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Позиция и размер окна между запусками: окно открывается там, где его
# оставили, а не прыгает в центр экрана.
tauri-plugin-window-state = "2"
# Уведомления Windows («идёт запись», «расшифровка готова», сбои резидента).
tauri-plugin-notification = "~2.4"
# Диалоги выбора файла (импорт записи) и «Сохранить как».
tauri-plugin-dialog = "~2.7"
# Один экземпляр: повторный запуск (ярлык, `--recording <id>`) не плодит
# второй трей и второй резидент, а открывает окно в уже запущенной оболочке.
# 2.5+ требует tauri 2.12 — закреплено на 2.4.x под tauri 2.11 (как в
# Cargo.lock), чтобы `cargo update` не утащил несовместимую версию. Так же
# закреплены notification и dialog: их минорные версии идут в ногу с tauri.
tauri-plugin-single-instance = "~2.4"
# Синхронный HTTP-клиент к control API резидента: вызывается из рабочих
# потоков надзора и опроса, async-рантайм там не нужен. Только http на
# 127.0.0.1 — TLS и gzip (фичи по умолчанию) не нужны.
ureq = { version = "2", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Жив ли держатель tray.lock (OpenProcess + GetExitCodeProcess): старый
# резидент без API оболочка не трогает, пока он жив. Свободное место перед
# установкой движка — GetDiskFreeSpaceExW; uv в job object, чтобы он умирал
# вместе с оболочкой. ShellExecuteW — страницы мастера в браузере (без cmd:
# его метасимволы в адресе не разбираются).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Дефолт Tauri: в релизе окно без консоли.
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
